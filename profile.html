<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - MessMateFinder</title>

    <link rel="stylesheet" href="css/profile.css">
</head>

<body>

    <div class="profile-container">

        <h1>👤 My Profile</h1>

        <div class="profile-info">

            <p>
                <strong>Name:</strong>
                <span id="name">Loading...</span>
            </p>

            <p>
                <strong>Email:</strong>
                <span id="email">Loading...</span>
            </p>

            <p>
                <strong>Mobile:</strong>
                <span id="mobile">Loading...</span>
            </p>

        </div>

        <!-- My Bookings -->
        <a href="my-bookings.html" class="bookings-btn">
            📅 My Bookings
        </a>

        <!-- My Payments -->
        <a href="my-payments.html" class="payments-btn">
            💳 My Payments
        </a>

        <!-- Logout -->
        <button onclick="logout()">
            Logout
        </button>

    </div>

    <script src="js/profile.js"></script>

</body>

</html>
