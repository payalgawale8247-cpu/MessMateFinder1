
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Payment - MessMateFinder</title>
<link rel="stylesheet" href="css/payment.css?v=3">
</head>
<body>
<div class="payment-container">
<h1>💳 Payment</h1>
<p class="subtitle">Complete your demo payment to confirm your booking</p>
<div class="booking-summary">
<h2>📋 Booking Summary</h2>
<p><strong>Booking ID:</strong><span id="bookingId">Loading...</span></p>
<p><strong>Mess:</strong><span id="messName">Loading...</span></p>
<p><strong>Amount:</strong><span id="amount">Not available</span></p>
</div>
<div class="payment-section">
<h2>Choose Payment Method</h2>
<p class="demo-notice">Demo Mode: This is a payment simulation. No real money will be charged.</p>
<form id="paymentForm">
<label><input type="radio" name="paymentMethod" value="UPI" required>📱 UPI</label>
<label><input type="radio" name="paymentMethod" value="Card">💳 Debit / Credit Card</label>
<label><input type="radio" name="paymentMethod" value="Cash">💵 Cash</label>
<button type="submit">Confirm Demo Payment</button>
</form>
<p id="paymentMessage" role="status" aria-live="polite"></p>
</div>
<a href="index.html" class="back-btn">← Back to Home</a>
</div>
<script src="js/payment.js?v=3"></script>
</body>
</html>
