<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MessMateFinder</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>MessMateFinder</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="location.html">Location</a>
        <a href="about.html">About</a>
        <a href="favorites.html">Favorites</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logout();return false;">Logout</a>
    </nav>
</header>
<main>
    <h2>Find Your Nearby Mess</h2>
    <p id="selectedLocationText">Find food that feels like home.</p>
    <input type="text" id="searchBox" placeholder="Search mess, location or food..." oninput="filterMesses()">
    <div class="filter-buttons">
        <button type="button" onclick="setFilter('All')">All</button>
        <button type="button" onclick="setFilter('Veg')">Veg</button>
        <button type="button" onclick="setFilter('Non-Veg')">Non-Veg</button>
        <button type="button" onclick="toggleAdvancedOptions()">Advanced Filters <span id="advancedArrow">▼</span></button>
    </div>
    <div id="advancedOptions" class="advanced-options">
        <button type="button" onclick="setFilter('Open Now')">Open Now</button>
        <button type="button" onclick="setFilter('Homemade')">Homemade</button>
        <button type="button" onclick="setFilter('Hotel Thali')">Hotel Thali</button>
        <button type="button" onclick="setFilter('1 km')">Within 1 km</button>
        <button type="button" onclick="setFilter('3 km')">Within 3 km</button>
        <button type="button" onclick="setFilter('5 km')">Within 5 km</button>
        <button type="button" onclick="setFilter('₹50 - ₹80')">₹50–₹80</button>
        <button type="button" onclick="setFilter('₹81 - ₹100')">₹81–₹100</button>
        <button type="button" onclick="setFilter('₹101 - ₹150')">₹101–₹150</button>
        <button type="button" onclick="setFilter('₹150+')">₹150+</button>
        <button type="button" onclick="setFilter('4.5+')">Rating 4.5+</button>
        <button type="button" onclick="setFilter('4.0+')">Rating 4.0+</button>
        <button type="button" onclick="setFilter('4.0+')">Rating 3.5+</button>
        <button type="button" onclick="setFilter('All')">Clear Filters</button>
    </div>
    <section id="messContainer">
        <p>Loading messes...</p>
    </section>
</main>
<script src="js/script.js"></script>
</body>
</html>
