
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mess Details - MessMateFinder</title>
<link rel="stylesheet" href="css/details.css">
</head>
<body>
<div class="container">
<!-- MESS DETAILS -->
<h1 id="messName">Loading...</h1>
<p class="mess-location">📍 <span id="location"></span></p>
<p>🍴 Food Type: <span id="foodType"></span></p>
<p>💰 Price: ₹<span id="price"></span></p>
<p>⭐ Rating: <span id="rating"></span></p>
<p>📝 Description: <span id="description"></span></p>
<p>🕐 Opening: <span id="openingTime"></span></p>
<p>🕐 Closing: <span id="closingTime"></span></p>
<!-- BUTTONS -->
<div class="button-group">
<button onclick="goBack()">← Back</button>
<button onclick="bookMess()">Book Now</button>
<button onclick="openMenu()">🍽️ Daily Menu</button>
</div>
<!-- MESS GALLERY -->
<section class="gallery-section" aria-label="Mess Gallery">
<h2>📸 Mess Gallery</h2>
<div id="messGallery" class="gallery-grid"></div>
</section>
<div id="galleryLightbox" class="gallery-lightbox" hidden>
<button type="button" id="galleryClose" class="gallery-close" aria-label="Close photo">×</button>
<img id="galleryLargeImage" alt="Mess gallery photo">
</div>
<!-- REVIEWS & RATINGS -->
<div class="reviews-section">
<h2>⭐ Reviews & Ratings</h2>
<div id="reviewsContainer">
<p>Loading reviews...</p>
</div>
<a id="writeReviewBtn" href="#" class="review-btn">✍️ Write a Review</a>
</div>
</div>
<script src="js/details.js"></script>
</body>
</html>
